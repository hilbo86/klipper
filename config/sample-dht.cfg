# Environmental monitoring only. Read docs/DHT.md before enabling.
# Build the AUXILIARY Nanos with test/configs/atmega328p-dht.config.
# Use the actual MCU names and verified serial paths in your [mcu] sections.
# RF2000 local snapshot: nano_dht11 -> wtrbrd, nano_dht22 -> curbrd.
# No [mcu] section or real serial identifier is intentionally provided here.
# External pull-up required; ^sensor_pin enables an optional internal pull-up
# only after checking the electrical levels. D13's LED can load the bus.

[temperature_sensor waermetauscher]
sensor_type: DHT11
sensor_pin: nano_dht11:PB5
dht_auxiliary_mcu: True
dht_report_time: 5.0
dht_max_age: 90.0

[temperature_sensor druckkammer]
sensor_type: DHT22
sensor_pin: nano_dht22:PD2
dht_auxiliary_mcu: True
dht_report_time: 5.0
dht_max_age: 30.0

# Status via Moonraker / printer objects:
# printer['dht_status waermetauscher'].humidity
# printer['dht_status druckkammer'].valid
# Console with the updated host adapter (no macro needed):
# QUERY_DHT SENSOR=waermetauscher
# QUERY_DHT SENSOR=druckkammer
# The matching Mainsail update shows valid humidity below the temperature.
# Only use values when valid, and inspect age_seconds and last_error.
# Standard temperature_sensor/M105 retains the last temperature (initially 0).
# DHT must never be used for a heater or safety/control decision.
