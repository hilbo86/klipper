# Configuration smoke test for the extrusion-force module stack
[stepper_x]
step_pin: 0
dir_pin: 1
enable_pin: !2
microsteps: 16
rotation_distance: 40
endstop_pin: ^3
position_endstop: 0
position_max: 200

[stepper_y]
step_pin: 4
dir_pin: !5
enable_pin: !6
microsteps: 16
rotation_distance: 40
endstop_pin: ^7
position_endstop: 0
position_max: 200

[stepper_z]
step_pin: 8
dir_pin: 9
enable_pin: !10
microsteps: 16
rotation_distance: 8
endstop_pin: ^11
position_endstop: 0.5
position_max: 200

[extruder]
step_pin: 12
dir_pin: 13
enable_pin: !14
microsteps: 16
rotation_distance: 33.5
nozzle_diameter: 0.4
filament_diameter: 1.75
heater_pin: 15
sensor_type: EPCOS 100K B57560G104F
sensor_pin: 16
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 280

[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100

[load_cell_probe_renkforce]
adc: 17
adc_rate: 100
force_calibration: 10000
sensor_orientation: normal
max_abs_force: 8000
stiffness: 1000
noise_level: 10

[extrusion_force_monitor]
minimum_flow: 0.5

[extrusion_force_profile pla_test]
extruder: extruder
nozzle_diameter: 0.4
material: PLA
max_material_temperature: 260
calibration_data: [{"temperature":220,"flow":1,"mean_force":200},{"temperature":220,"flow":5,"mean_force":600}]

[extrusion_force_calibration]
abort_force: 5000

[z_sense_offset]
force_threshold: 500
max_z_offset: 0.2

[extrusion_force_guard]
guard: False

[extruder_force_current]

[extrusion_force_control]
adaptive_speed: False
adaptive_temperature: False

[pressure_priming]
force_threshold: 500
max_prime_length: 10

[load_cell_filament]

[extrusion_force_diagnostics]
collision_detection: False
