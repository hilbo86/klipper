# Test config for continuous and step physical-button jogging
[stepper_x]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: ^PE5
position_endstop: 0
position_max: 200

[stepper_y]
step_pin: PF6
dir_pin: !PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PJ1
position_endstop: 0
position_max: 200

[stepper_z]
step_pin: PL3
dir_pin: PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 8
endstop_pin: ^PD3
position_endstop: 0
position_max: 200

[extruder]
step_pin: PA4
dir_pin: PA6
enable_pin: !PA2
microsteps: 16
rotation_distance: 33.5
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB4
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK5
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 250

[heater_bed]
heater_pin: PH5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK6
control: watermark
min_temp: 0
max_temp: 130

[output_pin jog_beeper]
pin: PL0
value: 0
shutdown_value: 0

[jog_buttons]
x_minus_pin: !PC0
x_plus_pin: !PC2
y_minus_pin: !PC4
y_plus_pin: !PC6
z_minus_pin: !PC7
z_plus_pin: !PG0
extrude_minus_pin: !PJ2
extrude_plus_pin: !PJ3
ok_pin: !PJ4
emergency_stop_pin: ^!PG2
enable_hold_time: 2
step_distance: 1
extrude_step_distance: 1
xy_speed: 30
z_speed: 3
extrude_speed: 4
extrude_distance: 20
mode_beeper: jog_beeper
mode_beep_frequency: 2000
mode_beep_duration: 0.035
mode_beep_gap: 0.040
debounce_delay: 0.01

[display]
lcd_type: hd44780
rs_pin: PH0
e_pin: PH1
d4_pin: PH3
d5_pin: PH4
d6_pin: PH6
d7_pin: PB0
click_pin: jog_buttons:ok
back_pin: jog_buttons:x_minus
up_pin: jog_buttons:y_plus
down_pin: jog_buttons:y_minus

[gcode_button delegated_x_plus]
pin: jog_buttons:x_plus
press_gcode:
    M117 X+

[gcode_button delegated_extrude_minus]
pin: jog_buttons:extrude_minus
press_gcode:
    M117 E-

[gcode_button delegated_extrude_plus]
pin: jog_buttons:extrude_plus
press_gcode:
    M117 E+

[gcode_button delegated_emergency_stop]
pin: jog_buttons:emergency_stop
press_gcode:
    M112

[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100
