# Offline integration: two auxiliary MCUs plus the existing ADC / output pins.
[mcu]
serial: /dev/null

[mcu nano_a]
serial: /dev/null

[mcu nano_b]
serial: /dev/null

[printer]
kinematics: none
max_velocity: 100
max_accel: 1000

[temperature_sensor exchanger]
sensor_type: DHT11
sensor_pin: nano_a:PB5
dht_auxiliary_mcu: True

[temperature_sensor chamber]
sensor_type: DHT22
sensor_pin: nano_b:PD2
dht_auxiliary_mcu: True

[analog_input rail_current_1]
sensor_pin: nano_b:PC4

[analog_input rail_current_2]
sensor_pin: nano_b:PC5

[analog_input rail_voltage_1]
sensor_pin: nano_b:PE2

[analog_input rail_voltage_2]
sensor_pin: nano_b:PE3

[power_output peltier_1]
pin: nano_b:PB1
shutdown_value: 0
current_pin: nano_b:PC1

[power_output peltier_2]
pin: nano_b:PB3
shutdown_value: 0
current_pin: nano_b:PC0

[gcode_button status_1]
pin: nano_b:PB2
press_gcode:
    M105

[gcode_button status_2]
pin: nano_b:PB4
press_gcode:
    M105

[gcode_macro DHT_STATUS]
gcode:
    {action_respond_info(printer['dht_status chamber']|string)}
    {action_respond_info(printer['dht_status exchanger']|string)}
