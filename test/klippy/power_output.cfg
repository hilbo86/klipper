[power_output monitored_digital]
pin: PH3
value: 0
shutdown_value: 0
current_pin: PF0
current_scale: 9.5
current_offset: -0.1

[power_output monitored_pwm]
pin: PH4
pwm: True
value: 0
shutdown_value: 0
cycle_time: 0.01
scale: 2.0
current_pin: PF1
current_report_time: 0.5
current_sample_time: 0.002
current_sample_count: 4

[analog_input rail_voltage]
sensor_pin: PF2
scale: -13.4
offset: 13.4
unit: V
decimal_places: 3
report_time: 0.5
sample_time: 0.001
sample_count: 8

[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: none
max_velocity: 300
max_accel: 3000
