name: Sync upstream into TH-Mod

on:
  push:
    branches:
      - TH-Mod
  schedule:
    - cron: '25 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-into-th-mod
  cancel-in-progress: false

jobs:
  sync:
    name: Sync and validate TH-Mod
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout TH-Mod
        uses: actions/checkout@v5
        with:
          ref: TH-Mod
          token: ${{ secrets.WORKFLOW_TOKEN || github.token }}
          fetch-depth: 0

      - name: Merge official Klipper into local branches
        id: sync
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upperstream https://github.com/Klipper3d/klipper.git 2>/dev/null || \
            git remote set-url upperstream https://github.com/Klipper3d/klipper.git
          git fetch origin \
            klipper-upstream:refs/remotes/origin/klipper-upstream \
            TH-Mod:refs/remotes/origin/TH-Mod
          git fetch upperstream master:refs/remotes/upperstream/master

          git switch -C klipper-upstream origin/klipper-upstream
          if ! git merge-base --is-ancestor upperstream/master klipper-upstream; then
            git merge --no-edit upperstream/master
          fi

          git switch -C TH-Mod origin/TH-Mod
          before_sha="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor klipper-upstream TH-Mod; then
            git merge --no-edit klipper-upstream
          fi
          target_sha="$(git rev-parse HEAD)"

          changed=false
          if [[ "${before_sha}" != "${target_sha}" ]]; then
            changed=true
          fi

          validate=false
          if [[ "${changed}" == 'true' || "${GITHUB_EVENT_NAME}" == 'push' ]]; then
            validate=true
          fi

          echo "changed=${changed}" >> "${GITHUB_OUTPUT}"
          echo "validate=${validate}" >> "${GITHUB_OUTPUT}"
          echo "target_sha=${target_sha}" >> "${GITHUB_OUTPUT}"

      - name: Cache CI dependencies
        if: steps.sync.outputs.validate == 'true'
        uses: actions/cache@v5
        with:
          path: ci_cache
          key: ${{ runner.os }}-build-${{ hashFiles('scripts/ci-install.sh') }}

      - name: Prepare tests
        if: steps.sync.outputs.validate == 'true'
        run: ./scripts/ci-install.sh

      - name: Run Klipper test suite
        if: steps.sync.outputs.validate == 'true'
        shell: bash
        run: |
          set +e
          ./scripts/ci-build.sh 2>&1 | tee ci-build.log
          ci_status="${PIPESTATUS[0]}"
          set -e

          if [[ "${ci_status}" -ne 0 ]]; then
            log_tail="$(tail -n 40 ci-build.log)"
            {
              echo '### Klipper test suite failed'
              echo '```text'
              printf '%s\n' "${log_tail}"
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
            log_tail="${log_tail//'%'/'%25'}"
            log_tail="${log_tail//$'\r'/'%0D'}"
            log_tail="${log_tail//$'\n'/'%0A'}"
            echo "::error file=scripts/ci-build.sh,title=Klipper test suite failed::${log_tail}"
            exit "${ci_status}"
          fi

      - name: Push validated branches
        if: steps.sync.outputs.changed == 'true'
        run: git push --atomic origin klipper-upstream TH-Mod

      - name: Upload micro-controller data dictionaries
        if: steps.sync.outputs.validate == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: data-dict
          path: ci_build/dict
